<!doctype html>
<html lang="zh-Hans">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; style-src 'unsafe-inline'; img-src data: wfolder-image: https: http:">
<style>
  :root {
    color-scheme: light dark;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --ink: #24272d;
    --muted: #555d6a;
    --line: #d0d4da;
    --surface: #e4e7eb;
    --link: #004baf;
    --keyword: #a21c56;
    --string: #066548;
    --number: #844008;
    --title: #4a36a3;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #efeff1;
      --muted: #aeb5bf;
      --line: #555961;
      --surface: #32343a;
      --link: #92baff;
      --keyword: #ff8cc2;
      --string: #8adde0;
      --number: #ffc079;
      --title: #bdadff;
    }
  }

  body { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
  main { box-sizing: border-box; width: min(100%, 860px); margin: auto; padding: 16px clamp(12px, 4vw, 30px) 26px; }
  main > :first-child { margin-top: 0; }
  main > :last-child { margin-bottom: 0; }
  h1, h2, h3, h4, h5, h6 { line-height: 1.3; margin: 1.35em 0 .48em; }
  h1 { font-size: 1.8rem; }
  h2 { font-size: 1.4rem; }
  p, ul, ol, pre, blockquote, figure, .table-scroll { margin: 0 0 .9rem; }
  ul, ol { padding-inline-start: 1.65em; }
  li > :is(ul, ol) { margin-bottom: 0; }
  a { color: var(--link); text-underline-offset: .16em; }
  img { max-width: 100%; height: auto; vertical-align: middle; }
  .image-unavailable { color: var(--muted); }
  blockquote { color: var(--muted); border-inline-start: 3px solid var(--line); padding-inline-start: .85rem; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 1.4rem 0; }
  code { font: .91em/1.55 ui-monospace, Menlo, monospace; }
  :not(pre) > code { background: var(--surface); padding: .12em .34em; border-radius: 4px; }
  pre, .diagram, .table-scroll { overflow: auto; }
  pre { background: var(--surface); border-radius: 7px; padding: .7rem .85rem; overflow-wrap: normal; }
  .table-scroll { border: 1px solid var(--line); border-radius: 6px; }
  table { border-collapse: collapse; min-width: 100%; }
  th, td { border-bottom: 1px solid var(--line); padding: .32em .65em; white-space: nowrap; }
  th { background: var(--surface); text-align: start; }
  tbody tr:last-child td { border-bottom: 0; }
  .diagram { border: 1px solid var(--line); border-radius: 7px; min-height: 3rem; padding: .6rem; }
  .diagram svg { display: block; height: auto; margin-inline: auto; }
  .diagram pre { margin: 0; }
  figcaption { color: var(--muted); font-size: .9em; margin-bottom: .5em; }
  .hljs-keyword, .hljs-selector-tag, .hljs-tag { color: var(--keyword); }
  .hljs-string, .hljs-regexp, .hljs-attribute { color: var(--string); }
  .hljs-number, .hljs-literal, .hljs-symbol { color: var(--number); }
  .hljs-title, .hljs-type, .hljs-built_in, .hljs-variable, .hljs-meta { color: var(--title); }
  .hljs-comment, .hljs-quote { color: var(--muted); }
</style>
<main aria-label="Markdown 正文"></main>
